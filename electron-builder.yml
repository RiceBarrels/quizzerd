appId: com.quizzerd.app
productName: QuizZerd
copyright: Copyright 2024

directories:
  output: dist
  buildResources: build

files:
  - electron/**/*
  - out/**/*
  - package.json

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Education

publish:
  provider: github
  releaseType: release
